<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>مخزوني</title>
    <meta name="description" content="نظام احترافي لإدارة المخازن وتجارة التجزئة مع دعم كامل للجرد والديون والتقارير المالية." />
    <meta property="og:title" content="مخزوني" />
    <meta property="og:description" content="نظام احترافي لإدارة المخازن وتجارة التجزئة مع دعم كامل للجرد والديون والتقارير المالية." />
    <meta name="theme-color" content="#023859">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
    <link rel="apple-touch-icon" href="/icon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      try {
        const settings = JSON.parse(localStorage.getItem('user_settings') || localStorage.getItem('app_settings'));
        if (settings && settings.darkMode) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.backgroundColor = '#0B1121';
        } else {
          document.documentElement.style.backgroundColor = '#F4F7FB';
        }
        if (settings && settings.colorTheme) {
          document.documentElement.setAttribute('data-theme', settings.colorTheme);
        } else {
          document.documentElement.setAttribute('data-theme', 'navy');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
